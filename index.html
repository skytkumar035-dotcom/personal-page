<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sandeep Kumawat</title>
        <style>
            /* predict: desktop = 3 cards in a row, under 600px = 1 card per row */
            * { box-sizing: border-box; }
            body { max-width: 900px; margin: 0 auto; padding: 16px; font-family: sans-serif; }
            .skills { display: grid ; grid-template-columns: repeat(3, 1fr); gap: 12px; }
            .card { background: #eee; padding: 16px; border-radius: 8px; }
            form { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
            @media (max-width: 600px) { .skills { grid-template-columns: 1fr; } }
        </style>
    </head>
    <body>
        <header>
            <h1>Sandeep Kumawat</h1>
            <p>I aim to be in the top 1%</p>
        </header>
        <section class="skills">
            <div class="card">Python</div>
            <div class="card">JavaScript</div>
            <div class="card">TypeScript</div>
        </section>
        <form>
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" placeholder="Message" required></textarea>
            <button type="submit">Send</button>
        </form>
        <p id="status"></p>
        <script>
            const form = document.querySelector("form");
            form.addEventListener("submit", (e) => {
            // If the line below is removed than the page will reload
            e.preventDefault();
            const data = Object.fromEntries(new FormData(form));
            // No it will not reload because .preventDefault() blocks it to reload
            console.log(data);   // { name: "...", email: "...", message: "..." }
            if (data.message.length < 10) {
                document.querySelector("#status").textContent = "Message too short";
                return;
            }
            document.querySelector("#status").textContent = "Thanks, " + data.name + "!";
            });
        </script>
    </body>
</html>
